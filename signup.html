<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Subscribe - Sports Weekly</title>
 
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
    
    <link rel="stylesheet" href="style.css">
</head>
 
<body>
 
    
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Sports Weekly</a>
 
            <div>
                <a class="text-white me-3" href="index.html">Home</a>
                <a class="text-white" href="signup.html">Subscribe</a>
            </div>
        </div>
    </nav>
 
 
    <!-- Sign-Up Form -->
    <div class="container py-5">
 
        <div class="text-center mb-4">
            <h1>Subscribe</h1>
            <p>Sign up to get the latest basketball and football news.</p>
        </div>
 
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
 
                <div class="card signup-card p-4">
 
                  
                    <div id="successMessage" class="alert alert-success d-none" role="alert"></div>
 
                   
                    <form id="signupForm" novalidate>
 
                        
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Jane Smith">
                            <div class="invalid-feedback" id="fullNameError"></div>
                        </div>
 
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address *</label>
                            <input type="text" class="form-control" id="email" placeholder="someone@somedomain.com">
                            <div class="invalid-feedback" id="emailError"></div>
                        </div>
 
                        <!-- Phone (optional) -->
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number (optional)</label>
                            <input type="text" class="form-control" id="phone" placeholder="555-123-4567">
                            <div class="invalid-feedback" id="phoneError"></div>
                        </div>
 
                        
                        <div class="mb-3">
                            <label for="age" class="form-label">Age *</label>
                            <input type="text" class="form-control" id="age" placeholder="21">
                            <div class="invalid-feedback" id="ageError"></div>
                        </div>
 
                       
                        <div class="mb-4">
                            <label for="address" class="form-label">Address *</label>
                            <input type="text" class="form-control" id="address" placeholder="123 Main St, State College, PA 16801">
                            <div class="invalid-feedback" id="addressError"></div>
                        </div>
 
                        <div class="d-grid gap-2 d-sm-flex">
                            <button type="submit" class="btn btn-primary flex-sm-fill">Subscribe</button>
                            <button type="reset" class="btn btn-outline-secondary flex-sm-fill">Clear</button>
                        </div>
 
                        <p class="text-muted small mt-3 mb-0">* Required field</p>
 
                    </form>
 
                </div>
 
            </div>
        </div>
 
 
        
        <div id="subscriberSection" class="d-none mt-5">
 
            <h2 class="text-center mb-4">Subscribers</h2>
 
            <div class="table-responsive">
                <table class="table table-striped table-bordered bg-white">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Age</th>
                            <th>Address</th>
                        </tr>
                    </thead>
                    <tbody id="subscriberTableBody"></tbody>
                </table>
            </div>
 
            <h3 class="mt-4">Subscriber Data (JSON)</h3>
            <pre id="jsonOutput" class="bg-dark text-white p-3 rounded"></pre>
 
            <button id="downloadBtn" class="btn btn-outline-primary">
                Download JSON File
            </button>
 
        </div>
 
    </div>
 
 

    <footer class="text-center p-3">
        <p>Sports Weekly - Basketball & Football</p>
    </footer>
 
    <script src="signup.js"></script>
 
</body>
 
</html>
